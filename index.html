<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beyblade Battle Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 
         * FORCED LANDSCAPE ROTATION 
         * Rotates container 90 degrees when viewport height > width (Portrait mode on phones)
         */
        #app-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-aspect-ratio: 1/1) {
            #app-container {
                width: 100vh !important;
                height: 100vw !important;
                transform: rotate(90deg);
                transform-origin: center center;
                position: absolute;
            }
        }

        @media (min-aspect-ratio: 1/1) {
            #app-container {
                width: 100vw !important;
                height: 100vh !important;
                transform: none;
                position: absolute;
            }
        }

        .font-teko {
            font-family: 'Teko', sans-serif;
        }

        /* Custom Split Backgrounds */
        .bg-blader1 {
            background-color: #03c6fc;
        }

        .bg-blader2 {
            background-color: #42ff94;
        }

        /* Text Effects */
        .text-glow {
            text-shadow: 0 0 16px rgba(0, 0, 0, 0.4), 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        /* Animated Beyblade Spin Graphic */
        .bey-spinner {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .btn-action {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0px rgba(0,0,0,0.3);
        }

        .btn-action:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px rgba(0,0,0,0.3);
        }

        /* Hide standard spin buttons on number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 60;
        }
    </style>
</head>
<body>

    <div id="app-viewport">
        <div id="app-container" class="relative overflow-hidden bg-slate-950 flex flex-col justify-between">
            
            <canvas id="confetti-canvas"></canvas>

            <!-- ================= SETUP SCREEN ================= -->
            <div id="setup-screen" class="w-full h-full flex flex-col justify-between p-5 bg-gradient-to-br from-slate-900 via-slate-950 to-black relative z-10">
                <!-- Header -->
                <div class="flex items-center justify-between border-b-2 border-cyan-500/30 pb-2">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-compact-disc text-cyan-400 text-3xl bey-spinner"></i>
                        <h1 class="text-3xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-emerald-400 font-teko uppercase">
                            BEYBLADE BATTLE TRACKER
                        </h1>
                    </div>
                    <span class="text-xs font-semibold px-3 py-1 bg-cyan-950 text-cyan-300 border border-cyan-500/40 rounded-full uppercase tracking-widest">
                        Match Setup
                    </span>
                </div>

                <!-- Main Form Area -->
                <div class="grid grid-cols-12 gap-4 my-auto items-center">
                    
                    <!-- Blader 1 Settings -->
                    <div class="col-span-5 bg-cyan-950/30 border-2 border-[#03c6fc]/50 rounded-2xl p-3 flex flex-col gap-2">
                        <div class="flex items-center gap-2 text-[#03c6fc] font-bold text-lg">
                            <i class="fa-solid fa-user-ninja"></i>
                            <span>BLADER 1 (LEFT)</span>
                        </div>
                        <input type="text" id="blader1-name-input" value="Blader 1" 
                            class="w-full bg-slate-900 border-2 border-[#03c6fc] text-white font-bold text-xl px-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#03c6fc]" 
                            placeholder="Enter Name">
                    </div>

                    <!-- Target Points Selector (Center) -->
                    <div class="col-span-2 flex flex-col items-center justify-center bg-slate-900/90 border-2 border-slate-700 rounded-2xl p-2">
                        <label class="text-[11px] text-slate-400 font-bold uppercase tracking-wider mb-1 text-center">Target Points</label>
                        <div class="flex items-center justify-center gap-2 w-full">
                            <button type="button" id="pts-decrement" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl flex items-center justify-center text-2xl font-black border-2 border-slate-600 active:scale-95 shadow-md">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <input type="number" id="max-points-input" value="4" min="1" max="99" 
                                class="w-16 h-14 bg-slate-950 border-2 border-cyan-500 text-center text-yellow-400 font-extrabold text-3xl rounded-xl focus:outline-none">
                            <button type="button" id="pts-increment" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl flex items-center justify-center text-2xl font-black border-2 border-slate-600 active:scale-95 shadow-md">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <span class="text-[10px] text-slate-400 mt-1 font-semibold">Default: 4 PTS</span>
                    </div>

                    <!-- Blader 2 Settings -->
                    <div class="col-span-5 bg-emerald-950/30 border-2 border-[#42ff94]/50 rounded-2xl p-3 flex flex-col gap-2">
                        <div class="flex items-center gap-2 text-[#42ff94] font-bold text-lg">
                            <i class="fa-solid fa-user-ninja"></i>
                            <span>BLADER 2 (RIGHT)</span>
                        </div>
                        <input type="text" id="blader2-name-input" value="Blader 2" 
                            class="w-full bg-slate-900 border-2 border-[#42ff94] text-white font-bold text-xl px-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#42ff94]" 
                            placeholder="Enter Name">
                    </div>
                </div>

                <!-- Start Battle Button -->
                <button type="button" id="start-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 via-teal-400 to-emerald-400 hover:brightness-110 text-slate-950 font-black text-3xl font-teko uppercase tracking-widest rounded-xl shadow-lg shadow-cyan-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-bolt text-2xl"></i>
                    START BATTLE!
                    <i class="fa-solid fa-bolt text-2xl"></i>
                </button>
            </div>


            <!-- ================= SCORE COUNTER SCREEN ================= -->
            <div id="counter-screen" class="w-full h-full hidden flex-row relative z-10">
                
                <!-- Center Divider Line / VS Badge & Refresh Button -->
                <div class="absolute inset-y-0 left-1/2 -translate-x-1/2 z-40 flex flex-col items-center justify-center pointer-events-none">
                    <div class="w-1 h-full bg-black/30 backdrop-blur-sm"></div>
                    <div class="absolute flex flex-col items-center gap-3 pointer-events-auto">
                        <div class="bg-slate-950 text-white font-black text-2xl font-teko px-3 py-0.5 rounded-full border-2 border-yellow-400 shadow-2xl flex items-center justify-center tracking-widest">
                            VS
                        </div>
                        <!-- Center Refresh / Reset Button -->
                        <button type="button" id="center-refresh-btn" title="Reset Match Scores" 
                            class="w-12 h-12 bg-slate-950 hover:bg-slate-900 text-yellow-400 hover:text-yellow-300 border-2 border-yellow-400 rounded-full flex items-center justify-center shadow-xl active:scale-90 transition-transform">
                            <i class="fa-solid fa-rotate-right text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- BLADER 1 SIDE (#03c6fc) -->
                <div class="w-1/2 h-full bg-blader1 text-slate-950 flex flex-col justify-between p-3 relative border-r-2 border-black/20">
                    
                    <!-- TOP CONTROL BAR (BLADER 1) -->
                    <div class="flex items-center justify-between gap-1.5 bg-black/20 p-1.5 rounded-xl backdrop-blur-md z-30">
                        <div class="flex gap-1.5 w-3/4">
                            <button type="button" id="b1-add1" class="btn-action flex-1 bg-slate-950 text-[#03c6fc] border border-cyan-300/40 font-extrabold text-xl py-1.5 rounded-lg active:bg-slate-900 flex items-center justify-center">
                                +1
                            </button>
                            <button type="button" id="b1-add2" class="btn-action flex-1 bg-slate-950 text-[#03c6fc] border border-cyan-300/40 font-extrabold text-xl py-1.5 rounded-lg active:bg-slate-900 flex items-center justify-center">
                                +2
                            </button>
                            <button type="button" id="b1-add3" class="btn-action flex-1 bg-slate-950 text-[#03c6fc] border border-cyan-300/40 font-extrabold text-xl py-1.5 rounded-lg active:bg-slate-900 flex items-center justify-center">
                                +3
                            </button>
                        </div>
                        <button type="button" id="b1-undo" title="Undo" class="btn-action w-1/4 bg-red-600 hover:bg-red-700 text-white font-bold text-lg py-1.5 rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>

                    <!-- BLADER 1 SCORE DISPLAY -->
                    <div class="flex flex-col items-center justify-center my-auto">
                        <span id="display-b1-name" class="text-2xl font-black uppercase text-slate-950 tracking-wider drop-shadow-sm truncate max-w-full px-2">
                            Blader 1
                        </span>
                        <div id="display-b1-score" class="font-teko text-9xl font-extrabold leading-none text-slate-950 text-glow my-0">
                            0
                        </div>
                    </div>

                    <!-- BOTTOM STATS BAR -->
                    <div class="flex justify-between items-center text-slate-900/80 font-bold text-xs uppercase px-1">
                        <span>Target: <span class="target-pts-val text-slate-950 font-extrabold text-sm">4</span> PTS</span>
                        <button type="button" id="setup-btn-1" class="text-xs text-slate-950/80 hover:text-slate-950 font-bold underline flex items-center gap-1">
                            <i class="fa-solid fa-gear"></i> Setup
                        </button>
                    </div>
                </div>

                <!-- BLADER 2 SIDE (#42ff94) -->
                <div class="w-1/2 h-full bg-blader2 text-slate-950 flex flex-col justify-between p-3 relative border-l-2 border-black/20">
                    
                    <!-- TOP CONTROL BAR (BLADER 2) -->
                    <div class="flex items-center justify-between gap-1.5 bg-black/20 p-1.5 rounded-xl backdrop-blur-md z-30">
                        <div class="flex gap-1.5 w-3/4">
                            <button type="button" id="b2-add1" class="btn-action flex-1 bg-slate-950 text-[#42ff94] border border-emerald-300/40 font-extrabold text-xl py-1.5 rounded-lg active:bg-slate-900 flex items-center justify-center">
                                +1
                            </button>
                            <button type="button" id="b2-add2" class="btn-action flex-1 bg-slate-950 text-[#42ff94] border border-emerald-300/40 font-extrabold text-xl py-1.5 rounded-lg active:bg-slate-900 flex items-center justify-center">
                                +2
                            </button>
                            <button type="button" id="b2-add3" class="btn-action flex-1 bg-slate-950 text-[#42ff94] border border-emerald-300/40 font-extrabold text-xl py-1.5 rounded-lg active:bg-slate-900 flex items-center justify-center">
                                +3
                            </button>
                        </div>
                        <button type="button" id="b2-undo" title="Undo" class="btn-action w-1/4 bg-red-600 hover:bg-red-700 text-white font-bold text-lg py-1.5 rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>

                    <!-- BLADER 2 SCORE DISPLAY -->
                    <div class="flex flex-col items-center justify-center my-auto">
                        <span id="display-b2-name" class="text-2xl font-black uppercase text-slate-950 tracking-wider drop-shadow-sm truncate max-w-full px-2">
                            Blader 2
                        </span>
                        <div id="display-b2-score" class="font-teko text-9xl font-extrabold leading-none text-slate-950 text-glow my-0">
                            0
                        </div>
                    </div>

                    <!-- BOTTOM STATS BAR -->
                    <div class="flex justify-between items-center text-slate-900/80 font-bold text-xs uppercase px-1">
                        <span>Target: <span class="target-pts-val text-slate-950 font-extrabold text-sm">4</span> PTS</span>
                        <button type="button" id="setup-btn-2" class="text-xs text-slate-950/80 hover:text-slate-950 font-bold underline flex items-center gap-1">
                            <i class="fa-solid fa-gear"></i> Setup
                        </button>
                    </div>
                </div>

            </div>


            <!-- ================= CONGRATULATIONS SCREEN ================= -->
            <div id="winner-screen" class="w-full h-full hidden flex-col items-center justify-between p-6 transition-colors duration-500 relative z-50">
                <div class="flex items-center gap-2 text-yellow-300 font-teko text-2xl tracking-widest mt-2 drop-shadow-md">
                    <i class="fa-solid fa-trophy text-yellow-300"></i>
                    BEYBLADE CHAMPION
                    <i class="fa-solid fa-trophy text-yellow-300"></i>
                </div>

                <div class="flex flex-col items-center justify-center my-auto text-center">
                    <h2 class="text-2xl font-bold text-slate-900/80 uppercase tracking-widest mb-1">CONGRATULATIONS</h2>
                    <h1 id="winner-name-display" class="text-6xl font-black text-slate-950 font-teko uppercase tracking-wider mb-2 drop-shadow-md">
                        BLADER 1
                    </h1>
                    <p class="text-xl font-black text-slate-900/90 tracking-wide uppercase">VICTORY IS YOURS!</p>
                </div>

                <div class="flex gap-4 w-full max-w-md mb-2">
                    <button type="button" id="rematch-btn" class="flex-1 py-3 bg-slate-950 hover:bg-slate-900 text-yellow-400 font-extrabold text-2xl font-teko uppercase rounded-xl shadow-xl active:scale-95 transition-all border border-yellow-400/30">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Rematch
                    </button>
                    <button type="button" id="edit-setup-btn" class="flex-1 py-3 bg-slate-950/80 hover:bg-slate-950 text-white font-extrabold text-2xl font-teko uppercase rounded-xl shadow-xl active:scale-95 transition-all border border-white/20">
                        <i class="fa-solid fa-gear mr-1"></i> Match Setup
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Script -->
    <script>
        // State Management
        let blader1Name = "Blader 1";
        let blader2Name = "Blader 2";
        let maxPoints = 4;
        let score1 = 0;
        let score2 = 0;
        
        // Independent Per-Side History Stacks
        let history1 = [];
        let history2 = [];

        // Web Audio Synthesizer for SFX
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'score') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'undo') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(250, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        noteGain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                        
                        noteOsc.start(now + idx * 0.1);
                        noteOsc.stop(now + idx * 0.1 + 0.3);
                    });
                }
            } catch (e) {
                // Audio fallback if muted or blocked
            }
        }

        // Initialize DOM Event Handlers
        document.addEventListener('DOMContentLoaded', () => {
            const setupScreen = document.getElementById('setup-screen');
            const counterScreen = document.getElementById('counter-screen');
            const winnerScreen = document.getElementById('winner-screen');
            
            const maxPointsInput = document.getElementById('max-points-input');
            const ptsIncBtn = document.getElementById('pts-increment');
            const ptsDecBtn = document.getElementById('pts-decrement');
            
            const b1Input = document.getElementById('blader1-name-input');
            const b2Input = document.getElementById('blader2-name-input');
            
            const startBtn = document.getElementById('start-btn');
            const centerRefreshBtn = document.getElementById('center-refresh-btn');
            
            const setupBtn1 = document.getElementById('setup-btn-1');
            const setupBtn2 = document.getElementById('setup-btn-2');
            
            const rematchBtn = document.getElementById('rematch-btn');
            const editSetupBtn = document.getElementById('edit-setup-btn');

            // Stepper controls
            ptsIncBtn.addEventListener('click', () => {
                let current = parseInt(maxPointsInput.value) || 4;
                maxPointsInput.value = Math.min(99, current + 1);
            });

            ptsDecBtn.addEventListener('click', () => {
                let current = parseInt(maxPointsInput.value) || 4;
                maxPointsInput.value = Math.max(1, current - 1);
            });

            // Start Battle Click Handler
            startBtn.addEventListener('click', (e) => {
                e.preventDefault();
                blader1Name = b1Input.value.trim() || "Blader 1";
                blader2Name = b2Input.value.trim() || "Blader 2";
                maxPoints = parseInt(maxPointsInput.value) || 4;
                if (maxPoints < 1) maxPoints = 1;

                // Update Display Text
                document.getElementById('display-b1-name').innerText = blader1Name;
                document.getElementById('display-b2-name').innerText = blader2Name;
                document.querySelectorAll('.target-pts-val').forEach(el => el.innerText = maxPoints);
                // Reset scores & history
                score1 = 0;
                score2 = 0;
                history1 = [];
                history2 = [];
                updateScoreDisplays();

                // Switch screens
                setupScreen.classList.add('hidden');
                winnerScreen.classList.add('hidden');
                counterScreen.classList.remove('hidden');
                counterScreen.classList.add('flex');

                playSound('score');
            });

            // Blader 1 Action Buttons
            document.getElementById('b1-add1').addEventListener('click', () => addScore(1, 1));
            document.getElementById('b1-add2').addEventListener('click', () => addScore(1, 2));
            document.getElementById('b1-add3').addEventListener('click', () => addScore(1, 3));
            document.getElementById('b1-undo').addEventListener('click', () => undoScore(1));

            // Blader 2 Action Buttons
            document.getElementById('b2-add1').addEventListener('click', () => addScore(2, 1));
            document.getElementById('b2-add2').addEventListener('click', () => addScore(2, 2));
            document.getElementById('b2-add3').addEventListener('click', () => addScore(2, 3));
            document.getElementById('b2-undo').addEventListener('click', () => undoScore(2));

            // Reset / Setup Navigation Buttons
            centerRefreshBtn.addEventListener('click', () => rematch());
            setupBtn1.addEventListener('click', () => resetToSetup());
            setupBtn2.addEventListener('click', () => resetToSetup());
            
            rematchBtn.addEventListener('click', () => rematch());
            editSetupBtn.addEventListener('click', () => resetToSetup());

            // Resize listener for confetti canvas
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        });

        function updateScoreDisplays() {
            document.getElementById('display-b1-score').innerText = score1;
            document.getElementById('display-b2-score').innerText = score2;
        }

        function addScore(bladerNum, points) {
            if (bladerNum === 1) {
                history1.push(points);
                score1 += points;
            } else {
                history2.push(points);
                score2 += points;
            }
            
            updateScoreDisplays();
            playSound('score');

            // Check Win Condition
            if (score1 >= maxPoints || score2 >= maxPoints) {
                setTimeout(() => {
                    triggerWin(score1 >= maxPoints ? blader1Name : blader2Name);
                }, 150);
            }
        }

        function undoScore(bladerNum) {
            if (bladerNum === 1) {
                if (history1.length > 0) {
                    const lastAdded = history1.pop();
                    score1 = Math.max(0, score1 - lastAdded);
                    updateScoreDisplays();
                    playSound('undo');
                }
            } else if (bladerNum === 2) {
                if (history2.length > 0) {
                    const lastAdded = history2.pop();
                    score2 = Math.max(0, score2 - lastAdded);
                    updateScoreDisplays();
                    playSound('undo');
                }
            }
        }

        function rematch() {
            score1 = 0;
            score2 = 0;
            history1 = [];
            history2 = [];
            updateScoreDisplays();

            document.getElementById('winner-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.add('hidden');
            const counter = document.getElementById('counter-screen');
            counter.classList.remove('hidden');
            counter.classList.add('flex');
            
            playSound('score');
        }

        function resetToSetup() {
            document.getElementById('winner-screen').classList.add('hidden');
            document.getElementById('counter-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        function triggerWin(winnerName) {
            document.getElementById('winner-name-display').innerText = winnerName;
            
            const winScreen = document.getElementById('winner-screen');
            // Apply signature dynamic color background based on winner
            if (winnerName === blader1Name) {
                winScreen.className = "w-full h-full flex flex-col items-center justify-between p-6 bg-gradient-to-br from-[#03c6fc] via-cyan-400 to-sky-600 text-slate-950 transition-colors duration-500 relative z-50";
            } else {
                winScreen.className = "w-full h-full flex flex-col items-center justify-between p-6 bg-gradient-to-br from-[#42ff94] via-emerald-400 to-teal-600 text-slate-950 transition-colors duration-500 relative z-50";
            }

            document.getElementById('counter-screen').classList.add('hidden');
            winScreen.classList.remove('hidden');

            playSound('win');
            startConfetti();
        }

        /* Confetti Effect */
        let canvas = document.getElementById('confetti-canvas');
        let ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function startConfetti() {
            particles = [];
            const colors = ['#03c6fc', '#42ff94', '#facc15', '#f43f5e', '#a855f7'];
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 4 + 2,
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }
            animateConfetti();
        }

        let animationFrame;
        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.vRot;

                if (p.y < canvas.height) active = true;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rot * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            });

            if (active && !document.getElementById('winner-screen').classList.contains('hidden')) {
                animationFrame = requestAnimationFrame(animateConfetti);
            }
        }

        // Function to completely stop and clear confetti canvas immediately
        function stopAndClearConfetti() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Clear confetti on any click anywhere in the viewport
        window.addEventListener('pointerdown', () => {
            if (particles.length > 0) {
                stopAndClearConfetti();
            }
        });
    </script>
</body>
</html>
